<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Super Admin - Elifons</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>body{margin:0;background:#000;color:#fff;font-family:Arial}header{background:linear-gradient(90deg,#d4af37,#ffcc00);color:#000;padding:15px;text-align:center;font-weight:bold}.tabs{display:flex;background:#111;overflow-x:auto}.tab{padding:12px 16px;cursor:pointer;color:gray;white-space:nowrap}.tab.active{color:#d4af37;border-bottom:2px solid #d4af37}.content{display:none;padding:12px}.content.active{display:block}.card{background:#111;border:1px solid #222;padding:12px;border-radius:12px;margin:8px 0}.stat{display:flex;gap:8px}.stat div{flex:1;background:#111;border:1px solid #222;padding:12px;border-radius:10px;text-align:center}.stat b{color:#d4af37;font-size:20px;display:block}button{padding:8px 12px;background:#d4af37;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:3px}input{width:100%;padding:10px;background:#222;border:1px solid #333;color:#fff;border-radius:10px;margin:6px 0}#loginBox{max-width:350px;margin:50px auto;background:#111;border:2px solid #d4af37;border-radius:15px;padding:20px}</style></head><body>
<div id="loginBox"><h3 style="color:#d4af37;text-align:center">🔐 SUPER ADMIN</h3><input id="p" placeholder="Phone 08000000000"><input id="pw" type="password" placeholder="admin123"><button onclick="login()" style="width:100%">Enter</button></div>
<div id="adminArea" style="display:none"><header>💛 ELIFONS SUPER ADMIN - LIVE FROM FIREBASE</header><div class="tabs"><div class="tab active" onclick="tab(event,'stats')">📊 Stats</div><div class="tab" onclick="tab(event,'users')">👥 Users</div><div class="tab" onclick="tab(event,'chats')">💬 All Chats</div><div class="tab" onclick="tab(event,'posts')">📸 Posts</div><div class="tab" onclick="tab(event,'groups')">👑 Groups</div><div class="tab" onclick="tab(event,'stories')">📖 Stories</div></div>
<div id="stats" class="content active"><div class="stat"><div><b id="tUsers">0</b><span>Users</span></div><div><b id="tChats">0</b><span>Chats</span></div><div><b id="tPosts">0</b><span>Posts</span></div><div><b id="tGroups">0</b><span>Groups</span></div></div><div id="statsList" class="card"></div></div>
<div id="users" class="content"><input id="search" placeholder="Search name..." oninput="filterUsers()"><div id="usersList"></div></div>
<div id="chats" class="content"><div id="chatsList"></div></div>
<div id="posts" class="content"><div id="postsList"></div></div>
<div id="groups" class="content"><div id="groupsList"></div></div>
<div id="stories" class="content"><div id="storiesList"></div></div>
</div><script>
const firebaseConfig={apiKey:"AIzaSyBYgBfnbS7gWjU_4Xr0XyqJzQe3QeXyqJzQeXqZQw",authDomain:"elifons-dcfb2.firebaseapp.com",databaseURL:"https://elifons-dcfb2-default-rtdb.firebaseio.com",projectId:"elifons-dcfb2",storageBucket:"elifons-dcfb2.appspot.com",messagingSenderId:"123456789",appId:"1:123456789:web:abc123"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const ADMIN_PHONE="07025934032",ADMIN_PASS="admin123";
function login(){let p=document.getElementById('p').value.trim(),pw=document.getElementById('pw').value.trim();if(p===ADMIN_PHONE&&pw===ADMIN_PASS){document.getElementById('loginBox').style.display='none';document.getElementById('adminArea').style.display='block';loadAll();}else alert('Wrong');}
function tab(e,id){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.content').forEach(c=>c.classList.remove('active'));document.getElementById(id).classList.add('active');e.target.classList.add('active');}
function loadAll(){
  // Users from posts (since you save name in posts) + also check elifons_users if exists in RTDB
  db.ref('posts').on('value',snap=>{
    let data=snap.val()||{}; let names={};
    Object.values(data).forEach(p=>names[p.name]= {name:p.name,pic:p.pic,last: p.time});
    let count=Object.keys(names).length;
    document.getElementById('tUsers').textContent=count;
    let ul=document.getElementById('usersList'); ul.innerHTML=''; let sl=document.getElementById('statsList'); sl.innerHTML='';
    Object.values(names).forEach(u=>{
      ul.innerHTML+=`<div class="card" style="display:flex;justify-content:space-between"><div><b>${u.name}</b><br><small>Last post: ${new Date(u.last).toLocaleString()}</small></div><div><button onclick="banUser('${u.name}')">Ban</button><button onclick="if(confirm('Delete posts of ${u.name}?'))deleteUserPosts('${u.name}')" style="background:#ff4444;color:#fff">Del Posts</button></div></div>`;
      sl.innerHTML+=`• ${u.name}<br>`;
    });
    document.getElementById('tPosts').textContent=Object.keys(data).length;
    let pl=document.getElementById('postsList'); pl.innerHTML=''; Object.entries(data).reverse().slice(0,100).forEach(([k,v])=>{
      pl.innerHTML+=`<div class="card"><b style="color:#d4af37">${v.name}</b> - ${new Date(v.time).toLocaleString()}<br>${v.caption||''}<br>${v.media?`<img src="${v.media}" style="width:100%;max-height:200px">`:''}<br><button onclick="deletePost('${k}')" style="background:#ff4444;color:#fff">Delete Post</button></div>`;
    });
  });
  db.ref('groups').on('value',snap=>{
    let data=snap.val()||{}; document.getElementById('tGroups').textContent=Object.keys(data).length;
    let gl=document.getElementById('groupsList'); gl.innerHTML='';
    Object.entries(data).forEach(([k,g])=>{
      gl.innerHTML+=`<div class="card"><b>${g.name}</b> (${g.members?g.members.length:0} members)<br><small>Admin: ${g.admin} | ID: ${g.id}</small><br><small>${g.members?g.members.join(', '):''}</small><br><button onclick="deleteGroup('${k}','${g.id}')" style="background:#ff4444;color:#fff">Delete Group</button></div>`;
    });
  });
  db.ref('chats').on('value',snap=>{
    let data=snap.val()||{}; let total=0; let cl=document.getElementById('chatsList'); cl.innerHTML='';
    Object.entries(data).forEach(([chatId, msgs])=>{
      let arr=Object.values(msgs||{}); total+=arr.length;
      cl.innerHTML+=`<div class="card"><b style="color:#d4af37">Chat: ${chatId}</b> - ${arr.length} msgs</div>`;
      arr.slice(-10).reverse().forEach(m=>{
        cl.innerHTML+=`<div style="background:#1a1a1a;margin:4px 0;padding:8px;border-radius:8px;font-size:13px"><b>${m.sender||m.from||'Unknown'}:</b> ${m.text||''} <small style="color:gray">${m.time?new Date(m.time).toLocaleTimeString():''}</small> <button onclick="deleteChat('${chatId}')" style="padding:2px 6px;font-size:10px;background:#ff4444;color:#fff">Del Chat</button></div>`;
      });
    });
    document.getElementById('tChats').textContent=total;
  });
  db.ref('stories').on('value',snap=>{
    let data=snap.val()||{}; let sl=document.getElementById('storiesList'); sl.innerHTML='';
    Object.entries(data).forEach(([k,s])=>{
      sl.innerHTML+=`<div class="card"><b>${s.name}</b> - ${new Date(s.time).toLocaleString()}<br><img src="${s.media}" style="width:100px;height:100px;object-fit:cover"><button onclick="deleteStory('${k}')" style="background:#ff4444;color:#fff">Delete</button></div>`;
    });
  });
}
function deletePost(k){if(!confirm('Delete?'))return; db.ref('posts/'+k).remove();}
function deleteGroup(k,id){if(!confirm('Delete group '+id+'?'))return; db.ref('groups/'+k).remove(); db.ref('chats/'+id).remove();}
function deleteChat(chatId){if(!confirm('Delete all messages in '+chatId+'?'))return; db.ref('chats/'+chatId).remove();}
function deleteStory(k){if(!confirm('Delete story?'))return; db.ref('stories/'+k).remove();}
function deleteUserPosts(name){db.ref('posts').once('value').then(s=>{let d=s.val()||{};Object.entries(d).forEach(([k,v])=>{if(v.name===name) db.ref('posts/'+k).remove();});alert('Deleted posts of '+name);});}
function banUser(name){let banned=JSON.parse(localStorage.getItem('elifons_banned')||'{}');banned[name]={time:Date.now()};localStorage.setItem('elifons_banned',JSON.stringify(banned));db.ref('banned/'+name.replace(/[^a-zA-Z0-9]/g,'_')).set({name:name,time:Date.now()});alert(name+' banned');}
function filterUsers(){let q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('#usersList.card').forEach(c=>{c.style.display=c.innerText.toLowerCase().includes(q)?'flex':'none';});}
</script></body></html>
