<script>
const firebaseConfig={apiKey:"AIzaSyBYgBfnbS7gWjU_4Xr0XyqJzQe3QeXyqZQw",authDomain:"elifons-dcfb2.firebaseapp.com",databaseURL:"https://elifons-dcfb2-default-rtdb.firebaseio.com",projectId:"elifons-dcfb2",storageBucket:"elifons-dcfb2.appspot.com",messagingSenderId:"123456789",appId:"1:123456789:web:abc123"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
const db=firebase.database();
let user=JSON.parse(localStorage.getItem('elifons_user')||'null');
if(!user) location.href='index.html';
let myPic=localStorage.getItem('myPic')||'https://i.pravatar.cc/100?u='+user.phone;
window.currentChat=null; window.isGroupChat=false; window.isAIChat=false;
function getChatId(other){let p=[user.phone, other].sort(); return 'CHAT_'+p[0]+'_'+p[1];}
function goOnline(){ db.ref('users/'+user.phone).update({online:true,lastSeen:Date.now()}); db.ref('users/'+user.phone+'/presence').set(true); db.ref('users/'+user.phone+'/presence').onDisconnect().remove(); db.ref('users/'+user.phone).onDisconnect().update({online:false,lastSeen:Date.now()}); }
goOnline(); setInterval(goOnline,25000);
window.addEventListener('beforeunload',()=>{db.ref('users/'+user.phone).update({online:false,lastSeen:Date.now()});});
db.ref('banned/'+user.phone).once('value').then(s=>{if(s.val()){alert('BANNED 🚫'); localStorage.clear(); location.href='index.html';}});
const ref=(d,p)=>firebase.database().ref(p);
const push=(r,d)=>r.push(d);
const get=(r)=>r.once('value');
const update=(r,d)=>r.update(d);
function formatLastSeen(ts){ if(!ts) return 'Offline'; let diff=Date.now()-ts; if(diff<60000) return 'online'; if(diff<3600000) return 'last seen '+Math.floor(diff/60000)+'m ago'; if(diff<86400000) return 'last seen '+Math.floor(diff/3600000)+'h ago'; return 'last seen '+new Date(ts).toLocaleDateString(); }
</script>

<div id="groupModal" class="group-modal"><div class="group-box"><h3 style="color:#d4af37">👑 New Group</h3><input id="groupName" placeholder="Group Name"><div id="selectedMembers" style="margin:10px 0;display:flex;flex-wrap:wrap;gap:5px"></div><div id="usersList"></div><button onclick="createGroup()" style="width:100%;margin-top:10px;background:#d4af37;padding:12px;border:none;border-radius:10px;font-weight:bold">Create Group</button><button onclick="closeGroupModal()" style="width:100%;background:#333;color:#fff;padding:10px;margin-top:5px;border:none;border-radius:10px">Cancel</button></div></div>
<script>
function showPage(id,el){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');if(el){document.querySelectorAll('.fb-nav span').forEach(s=>s.classList.remove('active'));el.classList.add('active');}}
let postMedia=null;
window.handlePostFile=()=>{let f=document.getElementById('postFile').files[0];if(!f)return;let r=new FileReader();r.onload=e=>{postMedia=e.target.result; alert('Media ready! Click Post ✅');};r.readAsDataURL(f);};
window.publishPost=()=>{let cap=document.getElementById('capInput').value.trim(); if(!cap &&!postMedia) return alert('Type something'); let type=postMedia&&postMedia.includes('video')?'video':'image'; push(ref(db,'posts'),{name:user.name,pic:myPic,phone:user.phone,caption:cap,media:postMedia||'',type:type,likes:0,likedBy:{},comments:0,time:Date.now()}); document.getElementById('capInput').value=''; postMedia=null; alert('Posted! ✅');};

function getAIReply(q){
 let l=q.toLowerCase();
 if(l.includes('caption')) return "🔥 VIRAL CAPTIONS:\n\n1. Golden vibes only ✨\n2. Less perfection, more authenticity 💛\n3. Your story matters 🚀\n4. Built from scratch, shining like gold 👑";
 if(l.includes('group') && l.includes('name')) return "👑 GROUP NAMES:\n\n- Gold Family 💛\n- Elifons Empire 🏆\n- Business Hustlers 🚀\n- Port Harcourt Connectors 🌍\n- Money Makers 💰";
 if(l.includes('idea')||l.includes('post')) return "💡 POST IDEAS:\n\n☀️ Morning motivation\n🎬 Behind scenes\n❓ Ask question\n📖 Your story\n💰 Money tip\n\nWhich? I will write it!";
 if(l.includes('business')||l.includes('money')) return "💰 TIP:\n\n1. Post daily 7am & 8pm\n2. Story to sell, feed to build trust\n3. Reply ALL comments\n4. Show face\n\nWhat do you sell?";
 if(l.includes('hello')||l.includes('hi')) return `Hey ${user.name}! 💛 I'm Elifons AI 🤖\n\nI can help:\n📝 Captions\n👑 Group names\n💡 Post ideas\n💰 Business tips\n\nAsk: "give me caption"`;
 return `Hi ${user.name}! 💛 You said: "${q}"\n\nTry:\n- "give me captions"\n- "group name ideas"\n- "post ideas"\n- "business tip"\n\nHow can I help? 🚀`;
}

window.handleStory=()=>{
 let f=document.getElementById('storyInput').files[0]; if(!f)return;
 let rd=new FileReader(); rd.onload=e=>{
  let media=e.target.result; let type=media.includes('video')?'video':'image';
  let newRef=db.ref('stories').push();
  newRef.set({key:newRef.key,name:user.name,phone:user.phone,pic:myPic,media:media,type:type,time:Date.now(),expire:Date.now()+86400000,views:0,likes:0,likedBy:{},viewers:{},comments:{}});
  alert('Story added! 24h ✅');
 }; rd.readAsDataURL(f);
};
let allStories=[]; let currentStoryIndex=0; let storyTimer=null;
function loadStories(){
 ref(db,'stories').on('value',snap=>{
  let data=snap.val()||{}; let bar=document.getElementById('storyBar'); let now=Date.now();
  allStories=Object.entries(data).map(([k,v])=>({fbKey:k,...v})).filter(s=>s.expire>now).sort((a,b)=>b.time-a.time);
  let grouped={}; allStories.forEach(s=>{ if(!grouped[s.phone]) grouped[s.phone]=[]; grouped[s.phone].push(s); });
  bar.innerHTML=`<div class="story add" onclick="document.getElementById('storyInput').click()"><img src="${myPic}"><br><small>➕ Add</small></div>`;
  Object.values(grouped).forEach(us=>{
   let first=us[0]; let isMe=first.phone===user.phone; let unviewed=us.some(st=>!st.viewers||!st.viewers[user.phone]);
   bar.innerHTML+=`<div class="story" onclick="openStory('${first.phone}')"><img src="${first.pic}" style="border-color:${isMe?'#555':(unviewed?'#d4af37':'#555')}"><br><small>${isMe?'You':first.name.split(' ')[0]}</small>${first.likes?`<br><small style="color:#ff3366">❤️${first.likes}</small>`:''}</div>`;
  });
 });
}
setTimeout(loadStories,600);
window.openStory=(phone)=>{
 let userStories=allStories.filter(s=>s.phone===phone).sort((a,b)=>a.time-b.time); if(!userStories.length) return;
 window.currentStoryUser=phone; window.currentStoryList=userStories; currentStoryIndex=0;
 window.currentStoryUserPhone=phone; window.currentStoryUserName=userStories[0].name;
 document.getElementById('storyViewer').style.display='flex'; showStory(currentStoryIndex);
};
function showStory(idx){
 if(idx>=window.currentStoryList.length){ closeStory(); return; }
 let s=window.currentStoryList[idx];
 document.getElementById('storyViewerPic').src=s.pic;
 document.getElementById('storyViewerName').innerText=s.name;
 document.getElementById('storyViewerTime').innerText=new Date(s.time).toLocaleTimeString();
 window.currentStory=s;
 let isMyStory=s.phone===user.phone;
 let btn=document.getElementById('storyViewersBtn');
 if(isMyStory){ btn.style.display='block'; document.getElementById('viewerCount').innerText=s.views||0; }else{
  btn.style.display='none';
  if(!s.viewers||!s.viewers[user.phone]){
   db.ref('stories/'+s.fbKey+'/viewers/'+user.phone).set({name:user.name,phone:user.phone,pic:myPic,time:Date.now()});
   db.ref('stories/'+s.fbKey).once('value').then(ss=>{ let val=ss.val(); let count=val.viewers?Object.keys(val.viewers).length:0; db.ref('stories/'+s.fbKey).update({views:count}); });
  }
 }
 let likeBtn=document.getElementById('storyLikeBtn');
 let liked=s.likedBy && s.likedBy[user.phone];
 likeBtn.innerText= liked? '❤️ Liked' : '🤍 Like';
 likeBtn.style.color= liked? '#ff3366':'#fff';
 let prog=document.getElementById('storyProgress'); prog.innerHTML='';
 window.currentStoryList.forEach((_,i)=>{ prog.innerHTML+=`<div style="flex:1;height:3px;border-radius:10px;background:${i<=idx?'#d4af37':'#444'}"></div>`; });
 let mediaDiv=document.getElementById('storyViewerMedia');
 mediaDiv.innerHTML= s.type==='video'? `<video src="${s.media}" autoplay playsinline style="max-width:100%;max-height:60vh"></video>` : `<img src="${s.media}" style="max-width:100%;max-height:60vh">`;
 clearTimeout(storyTimer); storyTimer=setTimeout(()=>{ nextStory(); },5000);
}
window.nextStory=()=>{ currentStoryIndex++; if(currentStoryIndex<window.currentStoryList.length){ showStory(currentStoryIndex);}else{closeStory();}};
window.closeStory=()=>{ document.getElementById('storyViewer').style.display='none'; clearTimeout(storyTimer); };
window.likeStory=()=>{
 let s=window.currentStory; if(!s) return;
 let liked=s.likedBy && s.likedBy[user.phone];
 if(liked){ db.ref('stories/'+s.fbKey+'/likedBy/'+user.phone).remove(); db.ref('stories/'+s.fbKey).update({likes:(s.likes||1)-1}); }
 else{ db.ref('stories/'+s.fbKey+'/likedBy/'+user.phone).set({name:user.name,time:Date.now()}); db.ref('stories/'+s.fbKey).update({likes:(s.likes||0)+1}); }
};
window.commentStory=()=>{
 let txt=document.getElementById('storyCommentInput').value.trim(); if(!txt) return;
 let s=window.currentStory; if(!s) return;
 push(ref(db,'stories/'+s.fbKey+'/comments'),{text:txt,name:user.name,phone:user.phone,pic:myPic,time:Date.now()});
 document.getElementById('storyCommentInput').value='';
 if(s.phone!==user.phone){
  let chatId=getChatId(s.phone);
  push(ref(db,'chats/'+chatId),{text:`Replied to your story: ${txt}`,sender:user.name,senderPhone:user.phone,storyReply:s.media,time:Date.now()});
 }
 alert('Replied! ✅');
};
window.showViewers=()=>{
 let s=window.currentStory; if(!s) return;
 document.getElementById('viewersModal').style.display='flex';
 db.ref('stories/'+s.fbKey+'/viewers').once('value').then(snap=>{
  let viewers=snap.val()||{}; let arr=Object.values(viewers).sort((a,b)=>b.time-a.time);
  document.getElementById('viewersCount2').innerText=arr.length; document.getElementById('viewerCount').innerText=arr.length;
  document.getElementById('viewersList').innerHTML=arr.length? arr.map(v=>`<div style="display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #222"><img src="${v.pic}" style="width:40px;height:40px;border-radius:50%"><div><b>${v.name}</b><br><small style="color:gray">${new Date(v.time).toLocaleString()}</small></div><span>👁️</span></div>`).join('') : '<p style="text-align:center;color:gray">No views</p>';
 });
 db.ref('stories/'+s.fbKey+'/likedBy').once('value').then(snap=>{
  let likes=snap.val()||{}; document.getElementById('storyLikesCount').innerText=Object.keys(likes).length;
 });
 db.ref('stories/'+s.fbKey+'/comments').once('value').then(snap=>{
  let comms=snap.val()||{}; let arr=Object.values(comms);
  document.getElementById('storyCommentsList').innerHTML='<b>💬 Replies:</b><br>'+ (arr.length? arr.map(c=>`<div style="padding:8px;border-bottom:1px solid #222"><b>${c.name}:</b> ${c.text}<br><small style="color:gray">${new Date(c.time).toLocaleTimeString()}</small></div>`).join('') : '<small style="color:gray">No replies</small>');
 });
};
 window.currentPostId=null;
function loadAll(){
 ref(db,'users').on('value',snap=>{
  let data=snap.val()||{}; let pl=document.getElementById('peopleList'); let cl=document.getElementById('chatList'); let ul=document.getElementById('usersList');
  pl.innerHTML=''; cl.innerHTML=''; if(ul) ul.innerHTML=''; let onlineCount=0;
  let allUsers=Object.values(data);
  allUsers.forEach(u=>{
   if(u.online) onlineCount++; if(u.phone===user.phone) return;
   let isOnline=u.online; let statusText=isOnline? '<span class="lastseen">🟢 online</span>' : `<span style="color:gray;font-size:11px">${formatLastSeen(u.lastSeen)}</span>`;
   let dot=isOnline? '<div class="online-dot"></div>' : '';
   let html=`<div class="user-card" data-name="${u.name.toLowerCase()}" data-phone="${u.phone}" style="padding:12px;border-bottom:1px solid #222;display:flex;gap:12px;align-items:center;cursor:pointer" onclick="openChat('${u.phone}','${u.name}','${u.pic}')"><div class="pic-wrap"><img src="${u.pic}" style="width:42px;height:42px;border-radius:50%;border:2px solid ${isOnline?'#00ff00':'#333'}">${dot}</div><div><b>${u.name} ${isOnline?'🟢':''}</b><br>${statusText}<br><small style="color:gray">${u.phone}</small></div><span style="margin-left:auto">💬</span></div>`;
   pl.innerHTML+=html; cl.innerHTML+=html;
   if(ul) ul.innerHTML+=`<div class="member"><span><div class="pic-wrap" style="display:inline-block"><img src="${u.pic}" style="width:30px;height:30px;border-radius:50%">${dot}</div> ${u.name} ${isOnline?'🟢':''}</span><button onclick="toggleMember('${u.name}')" style="background:#222;border:1px solid #d4af37;padding:4px 10px;border-radius:10px;color:#d4af37">Add</button></div>`;
  });
  document.querySelector('.top b').innerText=`💛 Elifons Gold (${onlineCount} online)`;
  let info=document.getElementById('searchInfo'); if(info) info.innerText=`${allUsers.length-1} users • Search by name/phone • 🤖 AI + 🔴 LIVE`;
 });
 ref(db,'posts').on('value',snap=>{
  let data=snap.val(); let feed=document.getElementById('feed'); feed.innerHTML=''; if(!data) return;
  Object.entries(data).map(([k,v])=>({key:k,...v})).sort((a,b)=>b.time-a.time).forEach(p=>{
   let liked=p.likedBy && p.likedBy[user.phone];
   let media=p.media? (p.type==='video'? `<video src="${p.media}" controls style="width:100%"></video>` : `<img src="${p.media}" style="width:100%">`) : '';
   feed.innerHTML+=`<div class="feed-post"><div class="post-head" onclick="openChat('${p.phone}','${p.name}','${p.pic}')"><img src="${p.pic}"><div><b style="color:#d4af37">${p.name}</b><br><small style="color:gray">${new Date(p.time).toLocaleString()}</small></div></div><div class="post-caption">${p.caption||''}</div>${media}<div class="actions"><span class="${liked?'liked':''}" onclick="likePost('${p.key}')">${liked?'❤️':'🤍'} ${p.likes||0} Like</span><span onclick="openComments('${p.key}')">💬 ${p.comments||0} Comment</span><span onclick="openChat('${p.phone}','${p.name}','${p.pic}')">📩 Message</span><span onclick="sharePost('${p.key}')">↗️ Share</span></div></div>`;
  });
 });
 ref(db,'groups').on('value',snap=>{
  let data=snap.val(); let gl=document.getElementById('groupList'); if(!gl) return; gl.innerHTML=''; if(!data) return;
  Object.values(data).forEach(g=>{ if(g.id==='GENERAL_LIVE') return; if(!g.members||!g.members.includes(user.name)) return; gl.innerHTML+=`<div style="padding:12px;border-bottom:1px solid #222;display:flex;gap:12px;align-items:center;cursor:pointer" onclick="openChat('${g.id}','${g.name}','',true)"><div style="width:50px;height:50px;border-radius:50%;background:linear-gradient(45deg,#d4af37,#ff9800);display:flex;align-items:center;justify-content:center">👥</div><div><b style="color:#d4af37">${g.name}</b><br><small>${g.members.length} members</small></div></div>`; });
 });
}
setTimeout(loadAll,500);
window.likePost=async(k)=>{ let s=await get(ref(db,'posts/'+k)); let p=s.val(); if(!p) return; let liked=p.likedBy && p.likedBy[user.phone]; if(liked){ await db.ref('posts/'+k+'/likedBy/'+user.phone).remove(); await update(ref(db,'posts/'+k),{likes:(p.likes||1)-1}); }else{ await db.ref('posts/'+k+'/likedBy/'+user.phone).set({name:user.name,time:Date.now()}); await update(ref(db,'posts/'+k),{likes:(p.likes||0)+1}); } };
window.openComments=(postId)=>{
 window.currentPostId=postId; document.getElementById('commentModal').style.display='flex';
 ref(db,'posts/'+postId+'/postComments').on('value',snap=>{
  let data=snap.val()||{}; let list=document.getElementById('commentList'); list.innerHTML='';
  let arr=Object.values(data).sort((a,b)=>a.time-b.time);
  if(arr.length===0) list.innerHTML='<p style="text-align:center;color:gray;padding:20px">No comments yet. Be first! 💬</p>';
  else list.innerHTML=arr.map(c=>`<div style="display:flex;gap:10px;padding:10px;border-bottom:1px solid #222"><img src="${c.pic}" style="width:32px;height:32px;border-radius:50%"><div><b style="color:#d4af37">${c.name}</b> <small style="color:gray">${new Date(c.time).toLocaleString()}</small><br>${c.text}</div></div>`).join('');
 });
};
window.closeComments=()=>{ document.getElementById('commentModal').style.display='none'; window.currentPostId=null; };
window.addComment=()=>{
 let txt=document.getElementById('commentInput').value.trim(); if(!txt||!window.currentPostId) return;
 push(ref(db,'posts/'+window.currentPostId+'/postComments'),{text:txt,name:user.name,pic:myPic,phone:user.phone,time:Date.now()});
 db.ref('posts/'+window.currentPostId).once('value').then(s=>{ let p=s.val(); db.ref('posts/'+window.currentPostId).update({comments:(p.comments||0)+1}); });
 document.getElementById('commentInput').value='';
};
window.sharePost=async(k)=>{ let s=await get(ref(db,'posts/'+k)); let p=s.val(); if(navigator.share){ navigator.share({title:'Elifons Gold',text:p.caption,url:location.href}); }else{ alert('Shared!'); } };
window.selected=[]; window.toggleMember=(name)=>{ if(window.selected.includes(name)) window.selected=window.selected.filter(n=>n!==name); else window.selected.push(name); document.getElementById('selectedMembers').innerHTML=window.selected.map(n=>`<span style="background:#d4af37;color:#000;padding:4px 8px;border-radius:10px;font-size:12px;margin:2px">${n}</span>`).join(''); };
window.openGroupModal=()=>{document.getElementById('groupModal').style.display='flex'; window.selected=[]; document.getElementById('selectedMembers').innerHTML=''; document.getElementById('groupName').value='';};
window.closeGroupModal=()=>{document.getElementById('groupModal').style.display='none';};
window.createGroup=async()=>{let gname=document.getElementById('groupName').value.trim(); if(!gname) return alert('Enter name'); let members=[...new Set([user.name,...window.selected])]; let id='GROUP_'+gname.replace(/\s/g,'_')+'_'+Date.now(); let group={id:id,name:gname,members:members,admin:user.name,time:Date.now()}; let snap=await push(ref(db,'groups'),group); await update(ref(db,'groups/'+snap.key),{key:snap.key}); push(ref(db,'chats/'+id),{text:`${user.name} created group "${gname}"`,sender:'System',type:'system',time:Date.now()}); closeGroupModal(); openChat(id,gname,'',true);};
let typingListener=null; let statusListener=null;
window.openChat=(id,name,pic,isGroup)=>{
 window.currentChat=id; window.isGroupChat=isGroup; window.isAIChat=(id==='ELIFONS_AI');
 document.getElementById('chatWindow').style.display='flex';
 document.getElementById('chatHeaderName').innerText=name;
 document.getElementById('chatHeaderPic').innerHTML=pic?`<img src="${pic}" style="width:36px;height:36px;border-radius:50%">`:`<div style="width:36px;height:36px;border-radius:50%;background:${id==='GENERAL_LIVE'?'red': (window.isAIChat?'linear-gradient(45deg,#d4af37,#00ffcc)':'#d4af37')};display:flex;align-items:center;justify-content:center">${isGroup?'👥':(window.isAIChat?'🤖':'👤')}</div>`;
 let chatRefId=isGroup? id : (window.isAIChat? 'CHAT_AI_'+user.phone : getChatId(id));
 if(!isGroup &&!window.isAIChat){
  if(statusListener) statusListener.off(); statusListener=ref(db,'users/'+id);
  statusListener.on('value',s=>{let u=s.val(); if(!u) return; let txt=u.online? '🟢 online' : formatLastSeen(u.lastSeen); document.getElementById('chatHeaderStatus').innerHTML=txt; document.getElementById('chatHeaderStatus').style.color=u.online?'#25D366':'gray';});
  if(typingListener) typingListener.off(); typingListener=ref(db,'typing/'+chatRefId);
  typingListener.on('value',snap=>{let data=snap.val()||{}; let other=Object.entries(data).filter(([k])=>k!==user.phone); if(other.length>0){document.getElementById('typingStatus').style.display='inline'; document.getElementById('typingStatus').innerText=other[0][1].name+' is typing...'; document.getElementById('chatHeaderStatus').style.display='none';}else{document.getElementById('typingStatus').style.display='none'; document.getElementById('chatHeaderStatus').style.display='inline';}});
 }else{
  document.getElementById('chatHeaderStatus').innerText= isGroup? (id==='GENERAL_LIVE'?'🌍 Everyone • LIVE': 'Group chat') : '🤖 Always online • Ask anything!';
  if(typingListener) typingListener.off(); typingListener=ref(db,'typing/'+chatRefId);
  typingListener.on('value',snap=>{let data=snap.val()||{}; let others=Object.entries(data).filter(([k])=>k!==user.phone); if(others.length>0){document.getElementById('typingStatus').style.display='inline'; document.getElementById('typingStatus').innerText=others.map(o=>o[1].name).join(', ')+' typing...';}else{document.getElementById('typingStatus').style.display='none';}});
 }
 ref(db,'chats/'+chatRefId).on('value',snap=>{
  let data=snap.val()||{}; let msgs=document.getElementById('messages'); msgs.innerHTML='';
  if(Object.keys(data).length===0 && window.isAIChat){msgs.innerHTML=`<div class="msg ai"><b>🤖 Elifons AI</b><br>Hi ${user.name}! 💛 Try:<br>• "give me captions"<br>• "group name ideas"<br>• "post ideas"<br>• "business tip"<br><br>How can I help? ✨</div>`;}
  if(Object.keys(data).length===0 && id==='GENERAL_LIVE'){msgs.innerHTML=`<div class="msg system">🌍 Welcome to General Live! All users chat here 👋</div>`;}
  Object.values(data).sort((a,b)=>a.time-b.time).forEach(m=>{
   let isMe=m.sender===user.name || m.senderPhone===user.phone;
   if(m.type==='system'){msgs.innerHTML+=`<div class="msg system">${m.text}</div>`;}
   else if(m.isAI){msgs.innerHTML+=`<div class="msg ai"><b>🤖 AI</b><br>${m.text.replace(/\n/g,'<br>')}</div>`;}
   else{msgs.innerHTML+=`<div class="msg ${isMe?'me':'them'}"><b style="font-size:11px">${isMe?'You':m.sender}</b><br>${m.storyReply?`<img src="${m.storyReply}" style="width:100px;border-radius:10px"><br>`:''}${m.text}<br><small style="font-size:10px;opacity:0.6">${new Date(m.time).toLocaleTimeString()} ${isMe?'✓✓':''}</small></div>`;}
  });
  msgs.scrollTop=msgs.scrollHeight;
 });
};
window.closeChat=()=>{document.getElementById('chatWindow').style.display='none'; if(typingListener) typingListener.off(); if(statusListener) statusListener.off(); if(window.currentChat){let chatRefId=window.isGroupChat? window.currentChat : (window.isAIChat? 'CHAT_AI_'+user.phone : getChatId(window.currentChat)); db.ref('typing/'+chatRefId+'/'+user.phone).remove();} window.currentChat=null;};
let typingTimer=null;
window.onTyping=()=>{if(!window.currentChat) return; let chatRefId=window.isGroupChat? window.currentChat : (window.isAIChat? 'CHAT_AI_'+user.phone : getChatId(window.currentChat)); let path=`typing/${chatRefId}/${user.phone}`; db.ref(path).set({name:user.name,time:Date.now()}); db.ref(path).onDisconnect().remove(); clearTimeout(typingTimer); typingTimer=setTimeout(()=>{db.ref(path).remove();},2500);};
window.sendMessage=()=>{let txt=document.getElementById('chatInput').value.trim(); if(!txt) return; let chatRefId=window.isGroupChat? window.currentChat : (window.isAIChat? 'CHAT_AI_'+user.phone : getChatId(window.currentChat)); push(ref(db,'chats/'+chatRefId),{text:txt,sender:user.name,senderPhone:user.phone,time:Date.now()}); document.getElementById('chatInput').value=''; db.ref('typing/'+chatRefId+'/'+user.phone).remove(); if(window.isAIChat){setTimeout(()=>{push(ref(db,'chats/'+chatRefId),{text:getAIReply(txt),sender:'Elifons AI 🤖',isAI:true,time:Date.now()});},700);} };
function filterPeople(){
 let q=document.getElementById('searchUser').value.toLowerCase();
 let cards=document.querySelectorAll('.user-card');
 let count=0;
 cards.forEach(card=>{
  let name=card.getAttribute('data-name'); let phone=card.getAttribute('data-phone');
  let match=name.includes(q) || phone.includes(q);
  card.style.display=match?'flex':'none';
  if(match) count++;
 });
 let info=document.getElementById('searchInfo');
 if(info) info.innerText= q? `${count} results for "${q}"` : `${cards.length} users • 🔍 Search • 🤖 AI + 🔴 LIVE`;
}
window.viewProfile=()=>{
 if(!window.currentChat || window.isGroupChat || window.isAIChat) return;
 db.ref('users/'+window.currentChat).once('value').then(s=>{
  let u=s.val(); if(!u) return;
  alert(`👤 ${u.name}\n📱 ${u.phone}\n${u.online?'🟢 online':'⚫ '+formatLastSeen(u.lastSeen)}`);
 });
};
</script>
