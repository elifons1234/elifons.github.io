<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Elifons Gold</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;padding-bottom:60px}
.top{position:sticky;top:0;z-index:10;background:#111;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:2px solid #d4af37}
.top b{color:#d4af37;font-size:22px}
.fb-nav{position:sticky;top:52px;z-index:9;background:#111;display:flex;justify-content:space-around;padding:8px 0;border-bottom:1px solid #222}
.fb-nav span{padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px}
.fb-nav span.active,.bottom-nav span.active{background:#d4af37;color:#000;font-weight:bold}
.page{display:none;min-height:60vh}.page.active{display:block}
.story-bar{display:flex;gap:10px;overflow-x:auto;padding:10px;background:#111;border-bottom:1px solid #222}
.story{flex:0 0 60px;text-align:center;cursor:pointer}
.story img{width:56px;height:56px;border-radius:50%;border:3px solid #d4af37;object-fit:cover}
.feed-post{background:#111;margin:8px auto;max-width:600px;border-radius:10px;overflow:hidden;border:1px solid #222}
.post-head{padding:10px;display:flex;gap:10px;align-items:center}
.post-head img{width:36px;height:36px;border-radius:50%}
.post-caption{padding:10px}
.post-media{width:100%;max-height:500px;object-fit:cover;background:#000}
.actions{display:flex;justify-content:space-around;padding:8px;border-top:1px solid #222}
.actions span{cursor:pointer;font-size:13px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:2px solid #d4af37;display:flex;justify-content:space-around;padding:8px 0;z-index:20}
.bottom-nav span{padding:6px 12px;border-radius:20px;cursor:pointer;font-size:13px}
.chat-window{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
.messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:75%;padding:8px 12px;border-radius:15px;font-size:14px;word-break:break-word}
.msg.me{align-self:flex-end;background:#d4af37;color:#000;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:#222;border-bottom-left-radius:4px}
.input-bar{display:flex;gap:6px;padding:8px;background:#111;border-top:1px solid #222;align-items:center}
.input-bar input{flex:1;padding:10px;border-radius:20px;border:none;background:#222;color:#fff}
.group-modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.group-box{background:#111;border:2px solid #d4af37;border-radius:15px;padding:20px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto}
.group-box input{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#222;color:#fff}
.member{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #222}
</style></head><body>
<script>
const firebaseConfig={apiKey:"AIzaSyBYgBfnbS7gWjU_4Xr0XyqJzQe3QeXyqZQw",authDomain:"elifons-dcfb2.firebaseapp.com",databaseURL:"https://elifons-dcfb2-default-rtdb.firebaseio.com",projectId:"elifons-dcfb2",storageBucket:"elifons-dcfb2.appspot.com",messagingSenderId:"123456789",appId:"1:123456789:web:abc123"};
try{firebase.initializeApp(firebaseConfig);}catch(e){}
const db=firebase.database();
let user=JSON.parse(localStorage.getItem('elifons_user')||'null');
if(!user){location.href='index.html';}
let myPic=localStorage.getItem('myPic')||'https://i.pravatar.cc/100?u='+user.name;
window.currentChat=null;
window.currentGroup=null;

// SAVE USER TO FIREBASE - so admin sees
db.ref('users/'+user.phone).set({name:user.name, phone:user.phone, pic:myPic, time:Date.now(), online:true});
db.ref('users/'+user.phone).onDisconnect().update({online:false});

// Check if banned
db.ref('banned/'+user.name.replace(/[^a-zA-Z0-9]/g,'_')).once('value').then(s=>{if(s.val()){alert('You are BANNED 🚫'); localStorage.clear(); location.href='index.html';}});

const ref=(d,p)=>firebase.database().ref(p);
const push=(r,d)=>r.push(d);
const get=(r)=>r.once('value');
const update=(r,d)=>r.update(d);
const remove=(r)=>r.remove();
</script>

<div class="top"><b>Elifons Gold</b><div style="display:flex;gap:8px"><span onclick="document.getElementById('storyInput').click()">➕ Story</span><span onclick="publishPost()">📤 Post</span></div></div>
<div class="fb-nav"><span class="active" onclick="showPage('home',this)">🏠 Home</span><span onclick="showPage('users',this)">👥 People</span><span onclick="showPage('chats',this)">💬 Chats</span><span onclick="showPage('groups',this)">👑 Groups</span><span onclick="showPage('profile',this)">👤 Me</span></div>

<input type="file" id="fileInput" hidden accept="image/*,video/*" onchange="handleFile()">
<input type="file" id="storyInput" hidden accept="image/*,video/*" onchange="handleStory()">

<div id="home" class="page active">
 <div id="storyBar" class="story-bar"></div>
 <div style="padding:10px;max-width:600px;margin:0 auto"><input id="capInput" placeholder="What's on your mind, ${user.name}? 💛" style="width:100%;padding:12px;border-radius:20px;border:1px solid #333;background:#222;color:#fff"><button onclick="publishPost()" style="margin-top:8px;width:100%;padding:10px;background:#d4af37;border:none;border-radius:10px;font-weight:bold">Post</button></div>
 <div id="feed"></div>
</div>

<div id="users" class="page">
 <div style="padding:10px"><input id="searchUser" placeholder="🔍 Search people..." oninput="filterPeople()" style="width:100%;padding:10px;border-radius:20px;background:#222;border:1px solid #333;color:#fff">
 <div id="peopleList"></div></div>
</div>

<div id="chats" class="page"><div id="chatList"></div></div>

<div id="groups" class="page"><div style="padding:10px"><button onclick="openGroupModal()" style="width:100%;padding:12px;background:#d4af37;border:none;border-radius:10px;font-weight:bold">➕ New Group</button></div><div id="groupList"></div></div>

<div id="profile" class="page" style="text-align:center;padding:20px"><img src="${myPic}" id="myProfilePic" style="width:80px;height:80px;border-radius:50%;border:3px solid #d4af37"><h3 id="myName"></h3><p id="myPhone" style="color:gray"></p><button onclick="localStorage.clear();location.href='index.html'" style="background:#ff4444;color:#fff;margin-top:20px">Logout</button></div>

<div id="chatWindow" class="chat-window">
 <div style="background:#111;padding:10px;display:flex;align-items:center;gap:10px;border-bottom:2px solid #d4af37"><span onclick="closeChat()" style="font-size:20px;cursor:pointer">←</span><div id="chatHeaderPic"></div><b id="chatHeaderName"></b></div>
 <div id="messages" class="messages"></div>
 <div class="input-bar"><input id="chatInput" placeholder="Type message..."><button onclick="sendMessage()" style="background:#d4af37;border:none;padding:10px 15px;border-radius:20px;font-weight:bold">Send</button></div>
</div>

<div id="groupModal" class="group-modal"><div class="group-box"><h3 style="color:#d4af37">New Group</h3><input id="groupName" placeholder="Group Name"><div id="selectedMembers" style="margin:10px 0;display:flex;flex-wrap:wrap;gap:5px"></div><div id="usersList"></div><button onclick="createGroup()" style="width:100%;margin-top:10px;background:#d4af37">Create Group</button><button onclick="closeGroupModal()" style="width:100%;background:#333;color:#fff">Cancel</button></div></div>

<script>
function showPage(id,el){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.fb-nav span').forEach(s=>s.classList.remove('active'));if(el)el.classList.add('active');}
let mediaBase64=null;
window.handleFile=()=>{let f=document.getElementById('fileInput').files[0];if(!f)return;let rd=new FileReader();rd.onload=e=>{mediaBase64=e.target.result;};rd.readAsDataURL(f);};
window.handleStory=()=>{let f=document.getElementById('storyInput').files[0];if(!f)return;let rd=new FileReader();rd.onload=e=>{push(ref(db,'stories'),{name:user.name,pic:myPic,media:e.target.result,time:Date.now()}); alert('Story added!');};rd.readAsDataURL(f);};
window.publishPost=()=>{
 let cap=document.getElementById('capInput').value.trim();
 if(!cap &&!mediaBase64) return alert('Type something');
 let type=mediaBase64&&mediaBase64.includes('video')?'video':'image';
 push(ref(db,'posts'),{name:user.name,pic:myPic,caption:cap,media:mediaBase64||'',type:type,likes:0,likedBy:{},time:Date.now()});
 document.getElementById('capInput').value=''; mediaBase64=null; alert('Posted!');
};

function loadAll(){
 ref(db,'users').on('value',snap=>{
  let data=snap.val()||{}; let pl=document.getElementById('peopleList'); let cl=document.getElementById('chatList'); let ul=document.getElementById('usersList');
  pl.innerHTML=''; cl.innerHTML=''; ul.innerHTML='';
  Object.values(data).forEach(u=>{
   if(u.phone===user.phone) return;
   let online=u.online?'🟢':'⚫';
   pl.innerHTML+=`<div style="padding:12px;border-bottom:1px solid #222;display:flex;gap:12px;align-items:center;cursor:pointer" onclick="openChat('${u.phone}','${u.name}','${u.pic}')"><img src="${u.pic}" style="width:40px;height:40px;border-radius:50%"><div><b>${u.name}</b> ${online}<br><small style="color:gray">${u.phone}</small></div><span style="margin-left:auto">💬</span></div>`;
   cl.innerHTML+=`<div style="padding:12px;border-bottom:1px solid #222;display:flex;gap:12px;align-items:center;cursor:pointer" onclick="openChat('${u.phone}','${u.name}','${u.pic}')"><img src="${u.pic}" style="width:40px;height:40px;border-radius:50%"><div><b>${u.name}</b><br><small>Tap to chat</small></div></div>`;
   ul.innerHTML+=`<div class="member"><span>👤 ${u.name}</span><button onclick="toggleMember('${u.name}','${u.phone}')" style="background:#222;border:1px solid #d4af37;padding:4px 10px;border-radius:10px;color:#d4af37">Add</button></div>`;
  });
 });
 ref(db,'posts').on('value',snap=>{
  let data=snap.val(); let feed=document.getElementById('feed'); feed.innerHTML='';
  if(!data){feed.innerHTML='<p style="text-align:center;color:gray;padding:20px">No posts yet</p>';return;}
  Object.entries(data).map(([k,v])=>({key:k,...v})).sort((a,b)=>b.time-a.time).forEach(p=>{
   let media=p.media? (p.type==='video'? `<video src="${p.media}" controls style="width:100%"></video>` : `<img src="${p.media}" style="width:100%">`) : '';
   feed.innerHTML+=`<div class="feed-post"><div class="post-head"><img src="${p.pic}"><div><b style="color:#d4af37">${p.name}</b><br><small style="color:gray">${new Date(p.time).toLocaleString()}</small></div></div><div style="padding:10px">${p.caption}</div>${media}<div class="actions"><span onclick="likePost('${p.key}')">💛 Like ${p.likes||0}</span><span onclick="openChat('${p.name}','${p.name}','${p.pic}')">💬 Chat</span></div></div>`;
  });
 });
 ref(db,'groups').on('value',snap=>{
  let data=snap.val(); let gl=document.getElementById('groupList'); gl.innerHTML='';
  if(!data)return; Object.values(data).forEach(g=>{
   if(!g.members||!g.members.includes(user.name)) return;
   gl.innerHTML+=`<div style="padding:12px;border-bottom:1px solid #222;display:flex;gap:12px;align-items:center;cursor:pointer" onclick="openChat('${g.id}','${g.name}','',true)"><div style="width:50px;height:50px;border-radius:50%;background:linear-gradient(45deg,#d4af37,#ff9800);display:flex;align-items:center;justify-content:center">👥</div><div><b style="color:#d4af37">${g.name}</b><br><small>${g.members.length} members</small></div></div>`;
  });
 });
 ref(db,'stories').on('value',snap=>{
  let data=snap.val(); let bar=document.getElementById('storyBar'); bar.innerHTML=`<div class="story" onclick="document.getElementById('storyInput').click()"><img src="${myPic}" style="border-color:gray"><br><small>You</small></div>`;
  if(!data) return; Object.values(data).slice(-15).forEach(s=>{
   bar.innerHTML+=`<div class="story"><img src="${s.pic}"><br><small>${s.name.split(' ')[0]}</small></div>`;
  });
 });
}
setTimeout(loadAll,500);
document.getElementById('myName').innerText=user.name; document.getElementById('myPhone').innerText=user.phone;

window.likePost=async(k)=>{
 let s=await get(ref(db,'posts/'+k)); let p=s.val(); if(!p) return;
 await update(ref(db,'posts/'+k),{likes:(p.likes||0)+1});
};
window.selected=[];
window.toggleMember=(name,phone)=>{
 if(window.selected.includes(name)) window.selected=window.selected.filter(n=>n!==name); else window.selected.push(name);
 document.getElementById('selectedMembers').innerHTML=window.selected.map(n=>`<span style="background:#d4af37;color:#000;padding:4px 8px;border-radius:10px;font-size:12px;margin:2px">${n}</span>`).join('');
};
window.openGroupModal=()=>{document.getElementById('groupModal').style.display='flex'; window.selected=[]; document.getElementById('selectedMembers').innerHTML=''; document.getElementById('groupName').value='';};
window.closeGroupModal=()=>{document.getElementById('groupModal').style.display='none';};
window.createGroup=async()=>{
 let gname=document.getElementById('groupName').value.trim(); if(!gname) return alert('Enter name');
 let members=[...new Set([user.name,...window.selected])];
 let id='GROUP_'+gname.replace(/\s/g,'_')+'_'+Date.now();
 let group={id:id,name:gname,members:members,admin:user.name,time:Date.now()};
 let snap=await push(ref(db,'groups'),group); await update(ref(db,'groups/'+snap.key),{key:snap.key});
 closeGroupModal(); alert('Group created!'); openChat(id,gname,'',true);
};

function getChatId(otherPhone){
 let phones=[user.phone, otherPhone].sort(); return 'CHAT_'+phones[0]+'_'+phones[1];
}
window.openChat=(id,name,pic,isGroup)=>{
 window.currentChat=id; window.isGroupChat=isGroup;
 document.getElementById('chatWindow').style.display='flex';
 document.getElementById('chatHeaderName').innerText=name;
 document.getElementById('chatHeaderPic').innerHTML=pic?`<img src="${pic}" style="width:36px;height:36px;border-radius:50%">`:'';
 let chatRefId=isGroup? id : getChatId(id);
 ref(db,'chats/'+chatRefId).on('value',snap=>{
  let data=snap.val()||{}; let msgs=document.getElementById('messages'); msgs.innerHTML='';
  Object.values(data).sort((a,b)=>a.time-b.time).forEach(m=>{
   let isMe=m.sender===user.name || m.senderPhone===user.phone;
   msgs.innerHTML+=`<div class="msg ${isMe?'me':'them'}"><b style="font-size:11px">${isMe?'You':m.sender}</b><br>${m.text}</div>`;
  });
  msgs.scrollTop=msgs.scrollHeight;
 });
};
window.closeChat=()=>{document.getElementById('chatWindow').style.display='none';};
window.sendMessage=()=>{
 let txt=document.getElementById('chatInput').value.trim(); if(!txt) return;
 let chatRefId=window.isGroupChat? window.currentChat : getChatId(window.currentChat);
 push(ref(db,'chats/'+chatRefId),{text:txt,sender:user.name,senderPhone:user.phone,time:Date.now()});
 document.getElementById('chatInput').value='';
};
function filterPeople(){let q=document.getElementById('searchUser').value.toLowerCase();document.querySelectorAll('#peopleList div').forEach(d=>{d.style.display=d.innerText.toLowerCase().includes(q)?'flex':'none';});}
</script>
</body></html>
