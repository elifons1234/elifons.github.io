<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Elifons Gold - Login</title><style>body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}.box{background:#111;border:2px solid #d4af37;padding:25px;border-radius:15px;width:100%;max-width:380px;text-align:center;box-shadow:0 0 20px rgba(212,175,55,0.2)}h2{color:#d4af37;margin:0 0 5px;font-size:28px}p{color:gray;margin:0 0 20px;font-size:14px}label{display:block;text-align:left;color:#d4af37;font-size:13px;margin:12px 0 4px;font-weight:bold}input{width:100%;padding:13px;margin:0;border-radius:10px;border:1px solid #333;background:#222;color:#fff;font-size:15px;box-sizing:border-box}input:focus{border-color:#d4af37;outline:none}button{width:100%;padding:13px;background:linear-gradient(90deg,#d4af37,#ffcc00);border:none;border-radius:10px;font-weight:bold;margin-top:18px;font-size:16px;color:#000;cursor:pointer}.link{margin-top:15px;font-size:13px;color:gray}</style></head><body><div class="box"><h2>Elifons Gold 💛</h2><p>Gold + Groups + AI</p><label>👤 Full Name</label><input id="name" placeholder="e.g. Amaka Gold"><label>📱 Phone Number</label><input id="phone" type="tel" placeholder="e.g. 08012345678"><label>🔒 Password</label><input id="pass" type="password" placeholder="Min 4 chars"><button onclick="login()">Login / Register 🚀</button><div class="link">First time? Enter details to create account</div></div><script>function login(){let name=document.getElementById('name').value.trim();let phone=document.getElementById('phone').value.trim();let pass=document.getElementById('pass').value.trim();if(!name)return alert('Enter your name 👤');if(!phone)return alert('Enter phone number 📱');if(phone.length<10)return alert('Enter valid phone');if(!pass)return alert('Enter password 🔒');if(pass.length<4)return alert('Password too short');let users=JSON.parse(localStorage.getItem('elifons_users')||'{}');if(users[phone]){if(users[phone].pass!==pass)return alert('Wrong password!');name=users[phone].name||name;}else{users[phone]={name:name,phone:phone,pass:pass,time:Date.now()};localStorage.setItem('elifons_users',JSON.stringify(users));}localStorage.setItem('elifons_user',JSON.stringify({name:name,phone:phone}));localStorage.setItem('myPic','https://i.pravatar.cc/150?u='+phone);location.href='dashboard.html';}</script></body></html>
