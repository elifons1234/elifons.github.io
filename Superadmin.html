<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Super Admin - Elifons Gold</title><style>body{margin:0;background:#000;color:#fff;font-family:Arial;padding:10px}.box{max-width:700px;margin:0 auto;background:#111;border:2px solid #d4af37;border-radius:15px;overflow:hidden}header{background:linear-gradient(90deg,#d4af37,#ffcc00);color:#000;padding:15px;text-align:center;font-weight:bold;font-size:18px}.tabs{display:flex;background:#222}.tab{flex:1;padding:12px;text-align:center;cursor:pointer;color:gray;font-size:13px;font-weight:bold}.tab.active{background:#111;color:#d4af37;border-bottom:2px solid #d4af37}.content{padding:15px;display:none}.content.active{display:block}input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#222;color:#fff;box-sizing:border-box}button{padding:10px 15px;background:#d4af37;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:5px 2px}.card{background:#222;padding:12px;border-radius:10px;margin:8px 0;border-left:3px solid #d4af37}.small{color:gray;font-size:12px}.stat{display:flex;gap:10px;margin:10px 0}.statBox{flex:1;background:#222;padding:15px;border-radius:10px;text-align:center}.statBox b{font-size:22px;color:#d4af37;display:block}.msg{background:#1a1a1a;padding:8px;border-radius:8px;margin:5px 0;font-size:13px}#loginBox{padding:20px}</style></head><body><div class="box"><header>💛 ELIFONS GOLD - SUPER ADMIN</header><div id="loginBox"><h3 style="color:#d4af37;text-align:center">Admin Login</h3><input id="aPhone" placeholder="Admin Phone e.g. 08000000000"><input id="aPass" type="password" placeholder="Admin Password"><button onclick="adminLogin()" style="width:100%;margin-top:10px">Enter Super Admin 🚀</button><p class="small" style="text-align:center;margin-top:10px">Default: 08000000000 / admin123</p></div><div id="adminArea" style="display:none"><div class="tabs"><div class="tab active" onclick="openTab('stats')">📊 Stats</div><div class="tab" onclick="openTab('users')">👥 Users</div><div class="tab" onclick="openTab('chats')">💬 Chats</div><div class="tab" onclick="openTab('groups')">👑 Groups</div></div><div id="stats" class="content active"><div class="stat"><div class="statBox"><b id="totalUsers">0</b><span class="small">Total Users</span></div><div class="statBox"><b id="totalChats">0</b><span class="small">Total Messages</span></div><div class="statBox"><b id="totalGroups">0</b><span class="small">Groups</span></div></div><div class="card"><b style="color:#d4af37">All Registered Users</b><div id="statsList" class="small" style="margin-top:10px">Loading...</div></div><button onclick="exportData()" style="background:#222;color:#fff;width:100%">📥 Export All Data</button></div><div id="users" class="content"><h3 style="color:#d4af37">👥 Users (<span id="uCount">0</span>)</h3><div id="usersList"></div><button onclick="clearUsers()" style="background:#ff4444;color:#fff;width:100%;margin-top:15px">🗑️ Delete ALL Users</button></div><div id="chats" class="content"><h3 style="color:#d4af37">💬 All Conversations</h3><div id="chatsList"></div><button onclick="clearChats()" style="background:#ff4444;color:#fff;width:100%;margin-top:15px">🗑️ Delete All Chats</button></div><div id="groups" class="content"><h3 style="color:#d4af37">👑 Groups / Gold Rooms</h3><div id="groupsList"></div><button onclick="clearGroups()" style="background:#ff4444;color:#fff;width:100%;margin-top:15px">🗑️ Delete All Groups</button></div><button onclick="location.href='index.html'" style="background:#333;color:#fff;width:100%;margin:15px 0">← Back to App</button></div></div><script>
const ADMIN_PHONE="07025934032";const ADMIN_PASS="admin123";
function adminLogin(){let p=document.getElementById('aPhone').value.trim();let pw=document.getElementById('aPass').value.trim();if(p===ADMIN_PHONE && pw===ADMIN_PASS){document.getElementById('loginBox').style.display='none';document.getElementById('adminArea').style.display='block';loadAll();}else alert('Wrong admin! Default is 08000000000 / admin123');}
function openTab(id){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.content').forEach(c=>c.classList.remove('active'));document.getElementById(id).classList.add('active');event.target.classList.add('active');}
function loadAll(){
let users=JSON.parse(localStorage.getItem('elifons_users')||'{}');
let chats=JSON.parse(localStorage.getItem('elifons_chats')||localStorage.getItem('chats')||localStorage.getItem('messages')||'[]');
let groups=JSON.parse(localStorage.getItem('elifons_groups')||localStorage.getItem('groups')||'[]');
if(!Array.isArray(chats)) chats=Object.values(chats);
if(!Array.isArray(groups)) groups=Object.values(groups);
document.getElementById('totalUsers').textContent=Object.keys(users).length;
document.getElementById('totalChats').textContent=Array.isArray(chats)?chats.length:Object.keys(chats).length;
document.getElementById('totalGroups').textContent=Array.isArray(groups)?groups.length:Object.keys(groups).length;
document.getElementById('uCount').textContent=Object.keys(users).length;
// Users list
let ul=document.getElementById('usersList');let sl=document.getElementById('statsList');ul.innerHTML='';sl.innerHTML='';
let keys=Object.keys(users);
if(keys.length===0){ul.innerHTML='<p class=small>No users yet</p>';sl.innerHTML='No users yet';}else{
keys.forEach(k=>{let u=users[k];let date=u.time?new Date(u.time).toLocaleString():'Unknown';let card=`<div class=card><div><b>${u.name||k}</b> <span class=small>${u.verified?'✅':''}</span><br><span class=small>📱 ${u.phone||k}<br>🕒 ${date}<br>💬 ${u.msgCount||0} msgs</span></div><div><button onclick="viewUser('${k}')" style="background:#222;color:#d4af37">View</button><button onclick="delUser('${k}')" style="background:#ff4444;color:#fff">Delete</button></div></div>`;ul.innerHTML+=card;sl.innerHTML+=`• ${u.name||k} - ${u.phone||k} - ${date}<br>`;});
}
// Chats list
let cl=document.getElementById('chatsList');
if(!chats || chats.length===0){cl.innerHTML='<p class=small>No chats found. Chats from dashboard.html will appear here if saved as elifons_chats.</p><p class=small>Keys found: '+Object.keys(localStorage).join(', ')+'</p>';}else{
cl.innerHTML='';(Array.isArray(chats)?chats:Object.values(chats)).slice(-100).reverse().forEach(m=>{let from=m.name||m.from||m.user||m.phone||'Unknown';let text=m.text||m.message||m.msg||JSON.stringify(m).slice(0,100);let time=m.time?new Date(m.time).toLocaleString():(m.timestamp?new Date(m.timestamp).toLocaleString():'');cl.innerHTML+=`<div class=msg><b style=color:#d4af37>${from}:</b> ${text}<br><span class=small>${time}</span></div>`;});
}
// Groups
let gl=document.getElementById('groupsList');
if(!groups || groups.length===0){gl.innerHTML='<p class=small>No groups yet</p>';}else{
gl.innerHTML='';(Array.isArray(groups)?groups:Object.values(groups)).forEach(g=>{let name=g.name||g.groupName||g.title||'Unnamed Group';let members=g.members?g.members.length:(g.count||0);gl.innerHTML+=`<div class=card><b>${name}</b><br><span class=small>👥 ${members} members | ID: ${g.id||'no-id'}</span></div>`;});
}
}
function delUser(phone){if(!confirm('Delete user '+phone+'?'))return;let users=JSON.parse(localStorage.getItem('elifons_users')||'{}');delete users[phone];localStorage.setItem('elifons_users',JSON.stringify(users));loadAll();}
function viewUser(phone){let users=JSON.parse(localStorage.getItem('elifons_users')||'{}');let u=users[phone];alert(`Name: ${u.name}\nPhone: ${u.phone}\nPassword: ${u.pass}\nJoined: ${new Date(u.time).toLocaleString()}`);}
function clearUsers(){if(!confirm('DELETE ALL USERS? This cannot be undone!'))return;localStorage.removeItem('elifons_users');loadAll();}
function clearChats(){if(!confirm('Delete all chats?'))return;localStorage.removeItem('elifons_chats');localStorage.removeItem('chats');localStorage.removeItem('messages');loadAll();}
function clearGroups(){if(!confirm('Delete all groups?'))return;localStorage.removeItem('elifons_groups');localStorage.removeItem('groups');loadAll();}
function exportData(){let data={users:localStorage.getItem('elifons_users'),chats:localStorage.getItem('elifons_chats')||localStorage.getItem('chats'),groups:localStorage.getItem('elifons_groups'),allKeys:Object.keys(localStorage)};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='elifons_backup_'+Date.now()+'.json';a.click();}
</script></body></html>
